pdZoomBtn.addEventListener('click',e=>{e.stopPropagation();openZoom()});document.getElementById('pdMedia').addEventListener('click',e=>{if(!e.target.closest('.pd-zoom-btn'))openZoom()});pdLightboxClose.addEventListener('click',closeZoom);pdLightboxPrev.addEventListener('click',e=>{e.stopPropagation();showZoomImage(pdZoomIndex-1)});pdLightboxNext.addEventListener('click',e=>{e.stopPropagation();showZoomImage(pdZoomIndex+1)});pdLightboxZoom.addEventListener('click',e=>{e.stopPropagation();zoomIn()});pdLightboxImage.addEventListener('click',e=>{e.stopPropagation();pdZoomScale===1?zoomIn():zoomOut()});pdLightboxImage.addEventListener('wheel',e=>{e.preventDefault();e.deltaY<0?zoomIn():zoomOut()},{passive:false});pdLightboxImage.addEventListener('pointerdown',e=>{if(pdZoomScale<=1)return;pdZoomDragging=true;pdZoomStartX=e.clientX-pdZoomPanX;pdZoomStartY=e.clientY-pdZoomPanY;pdLightboxImage.setPointerCapture(e.pointerId)});pdLightboxImage.addEventListener('pointermove',e=>{if(!pdZoomDragging)return;pdZoomPanX=e.clientX-pdZoomStartX;pdZoomPanY=e.clientY-pdZoomStartY;applyZoom()});pdLightboxImage.addEventListener('pointerup',()=>pdZoomDragging=false);pdLightbox.addEventListener('click',e=>{if(e.target===pdLightbox)closeZoom()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom();if(!pdLightbox.classList.contains('open'))return;if(e.key==='ArrowLeft')showZoomImage(pdZoomIndex-1);if(e.key==='ArrowRight')showZoomImage(pdZoomIndex+1);if(e.key==='+'||e.key==='=')zoomIn();if(e.key==='-'||e.key==='_')zoomOut()});

let cart=[];try{cart=JSON.parse(localStorage.getItem(CART)||'[]')}catch(e){}const root=document.getElementById('cartRoot');root.innerHTML=`<div class="mm-cart-overlay"></div><aside class="mm-cart-drawer"><div class="mm-cart-head"><h2>Tu carrito</h2><button class="mm-cart-close">×</button></div><div class="mm-cart-items"></div><div class="mm-cart-empty">Tu carrito está vacío.</div><div class="mm-cart-foot"><div><span>Productos</span><strong id="cartCount">0</strong></div><button class="mm-cart-checkout">CONTINUAR</button></div></aside>`;const drawer=root.querySelector('.mm-cart-drawer');function save(){localStorage.setItem(CART,JSON.stringify(cart))}async function render(){const n=cart.reduce((s,x)=>s+x.qty,0);document.getElementById('cartAction').querySelector('span').textContent=n;document.getElementById('cartCount').textContent=n;root.querySelector('.mm-cart-empty').style.display=cart.length?'none':'block';const rows=[];for(const x of cart){rows.push({x,src:await MMMedia.resolve(x.img)||'assets/featured-new-01.jpg'})}root.querySelector('.mm-cart-items').innerHTML=rows.map(({x,src},i)=>`<div class="mm-cart-item"><img src="${esc(src)}"><div class="mm-cart-item-info"><strong>${esc(x.name)}</strong><span>${esc(x.brand||'')}</span><div class="mm-cart-qty"><button data-d="${i}">−</button><b>${x.qty}</b><button data-i="${i}">+</button><button class="mm-cart-remove" data-r="${i}">Eliminar</button></div></div></div>`).join('')}function open(){drawer.classList.add('open');document.body.classList.add('mm-cart-lock')}function close(){drawer.classList.remove('open');document.body.classList.remove('mm-cart-lock')}document.getElementById('cartAction').onclick=open;root.addEventListener('click',e=>{if(e.target.matches('.mm-cart-close,.mm-cart-overlay'))close();if(e.target.dataset.i!==undefined){cart[e.target.dataset.i].qty++;save();render()}if(e.target.dataset.d!==undefined){cart[e.target.dataset.d].qty--;if(cart[e.target.dataset.d].qty<=0)cart.splice(e.target.dataset.d,1);save();render()}if(e.target.dataset.r!==undefined){cart.splice(e.target.dataset.r,1);save();render()}});document.getElementById('addBtn').onclick=()=>{if(!p)return;const f=cart.find(x=>x.id===p.id);if(f)f.qty++;else cart.push({id:p.id,name:p.name,brand:p.brand,img:p.image||'assets/featured-new-01.jpg',qty:1});save();render();open()};render();
