<script>
const KEY='mm_products_v1', CART='mm_cart_v1', QKEY='mm_quotes_v1';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
const ALLOWED_BRANDS=['CASIO','SEIKO','CITIZEN','ORIENT','BULOVA','G-SHOCK'];
function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(p)?p.filter(x=>x && !['featured-1','featured-2','featured-3','featured-4','featured-5','featured-6','featured-7','featured-8',...Array.from({length:8},(_,i)=>'seed-'+i)].includes(String(x.id))):[]}catch(e){return []}}
function priceNum(p){if(Number(p.usd)>0)return Number(p.usd);if(p.price){const m=String(p.price).replace(/\./g,'').match(/[0-9]+/);return m?Number(m[0]):0}return 0}
let quotes={usd:0,gold:0,silver:0};try{quotes={...quotes,...JSON.parse(localStorage.getItem(QKEY)||'{}')}}catch(e){}
function moneyARS(v){return Number(v||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0})}
function publicPrice(p){if(p.pricing==='gold')return Number(p.gold||0)*Number(quotes.gold||0)+Number(p.workmanship||0);if(p.pricing==='silver')return Number(p.silver||0)*Number(quotes.silver||0)+Number(p.workmanship||0);return Number(p.usd||0)*Number(quotes.usd||0)}
function price(p){const n=publicPrice(p);if(n>0)return moneyARS(n);if(/^\s*\$/.test(String(p.price||'')))return p.price;return 'Consultar'}
async function imageFor(p){const src=String(p.image||'');if(src.startsWith('idb://'))return await MMMedia.resolve(src)||'assets/featured-new-01.jpg';if(src.startsWith('data:image/')||src.startsWith('http')||src.startsWith('assets/'))return src;const s=((p.name||'')+' '+(p.model||'')).toLowerCase();if(/baby-?g|ba-111/.test(s))return 'assets/featured-new-07.jpg';if(/g-?shock/.test(s))return 'assets/featured-new-02.jpg';if(/classic/.test(s))return 'assets/featured-new-02.jpg';if(/edifice/.test(s))return 'assets/featured-new-01.jpg';return 'assets/featured-new-01.jpg'}
let selectedBrand='all', appliedFilters={type:'',gender:'',price:'',strap:'',dial:''};
function matchesFilter(p){const s=[p.name,p.model,p.description,p.type,p.gender,p.strap,p.band,p.dialColor,p.color].join(' ').toLowerCase();if(appliedFilters.type&&!s.includes(appliedFilters.type.toLowerCase()))return false;if(appliedFilters.gender&&!s.includes(appliedFilters.gender.toLowerCase()))return false;if(appliedFilters.strap&&!s.includes(appliedFilters.strap.toLowerCase()))return false;if(appliedFilters.dial&&!s.includes(appliedFilters.dial.toLowerCase()))return false;if(appliedFilters.price){const n=priceNum(p);if(appliedFilters.price==='0-150'&&(n<1||n>150))return false;if(appliedFilters.price==='151-300'&&(n<151||n>300))return false;if(appliedFilters.price==='301-600'&&(n<301||n>600))return false;if(appliedFilters.price==='601+'&&n<601)return false}return true}
async function render(){const q=document.getElementById('catalogSearch').value.toLowerCase().trim();let ps=load().filter(p=>p.published!==false&&!/^joyas?$/i.test(String(p.category||'').trim()));if(selectedBrand!=='all')ps=ps.filter(p=>String(p.brand||'').toUpperCase()===selectedBrand);ps=ps.filter(p=>!q||[p.name,p.brand,p.description,p.model].join(' ').toLowerCase().includes(q));ps=ps.filter(matchesFilter);const sort=document.getElementById('sortSelect').value;if(sort==='priceAsc')ps.sort((a,b)=>priceNum(a)-priceNum(b));if(sort==='priceDesc')ps.sort((a,b)=>priceNum(b)-priceNum(a));if(sort==='name')ps.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es'));document.getElementById('catalogCount').textContent=ps.length+' '+(ps.length===1?'producto':'productos');const g=document.getElementById('watchGrid');const rows=await Promise.all(ps.map(async p=>({p,src:await imageFor(p)})));g.innerHTML=rows.length?rows.map(({p,src})=>`<article class="watch-card"><div class="watch-media"><img src="${esc(src)}" alt="${esc(p.name||'Reloj')}" onerror="this.onerror=null;this.src='assets/featured-new-01.jpg'"></div><div class="watch-info"><div class="watch-brand">${esc(p.brand||'M&amp;M')}</div><h2 class="watch-name">${esc(p.name||'Sin nombre')}</h2>${p.model?`<div class="watch-model">${esc(p.model)}</div>`:''}<div class="watch-price">${esc(price(p))}</div><a class="watch-btn" href="producto.html?id=${encodeURIComponent(p.id||'')}">VER PRODUCTO</a></div></article>`).join(''):'<div class="empty-catalog">No hay relojes que coincidan con los filtros seleccionados.</div>'}

document.querySelectorAll('.brand-filter').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.brand-filter').forEach(b=>b.classList.remove('active'));btn.classList.add('active');selectedBrand=btn.dataset.brand;render()}));
document.getElementById('catalogSearch').addEventListener('input',render);document.getElementById('sortSelect').addEventListener('change',render);document.getElementById('catalogSearchBtn').addEventListener('click',()=>{document.getElementById('catalogSearch').focus();document.getElementById('catalogSearch').scrollIntoView({behavior:'smooth',block:'center'})});
document.querySelectorAll('.filter-toggle').forEach(btn=>btn.addEventListener('click',()=>document.getElementById('filter-'+btn.dataset.filter).classList.toggle('open')));
document.getElementById('applyFilters').addEventListener('click',()=>{appliedFilters={type:document.getElementById('typeFilter').value,gender:document.getElementById('genderFilter').value,price:document.getElementById('priceFilter').value,strap:document.getElementById('strapFilter').value,dial:document.getElementById('dialFilter').value};render();document.getElementById('catalogSidebar').classList.remove('mobile-open')});
document.getElementById('mobileFilterBtn').addEventListener('click',()=>document.getElementById('catalogSidebar').classList.toggle('mobile-open'));
let cart=[];try{cart=JSON.parse(localStorage.getItem(CART)||'[]')}catch(e){cart=[]}const cartRoot=document.getElementById('cartRoot');cartRoot.innerHTML=`<div class="mm-cart-overlay" data-close></div><aside class="mm-cart-drawer" aria-label="Carrito de compras"><div class="mm-cart-head"><h2>Tu carrito</h2><button type="button" class="mm-cart-close">×</button></div><div class="mm-cart-items"></div><div class="mm-cart-empty">Tu carrito está vacío.</div><div class="mm-cart-foot"><div><span>Productos</span><strong class="mm-cart-count">0</strong></div><button type="button" class="mm-cart-checkout">CONTINUAR</button></div></aside>`;const drawer=cartRoot.querySelector('.mm-cart-drawer'),items=cartRoot.querySelector('.mm-cart-items'),empty=cartRoot.querySelector('.mm-cart-empty');function saveCart(){localStorage.setItem(CART,JSON.stringify(cart))}function renderCart(){const n=cart.reduce((s,p)=>s+(Number(p.qty)||0),0);document.getElementById('cartAction').querySelector('span').textContent=n;document.getElementById('cartAction').setAttribute('aria-label',`Carrito, ${n} ${n===1?'producto':'productos'}`);empty.style.display=cart.length?'none':'block';items.innerHTML=cart.map((p,i)=>`<div class="mm-cart-item"><img src="${esc(p.img)}" alt=""><div class="mm-cart-item-info"><strong>${esc(p.name)}</strong><span>${esc(p.brand||'')}</span><div class="mm-cart-qty"><button data-dec="${i}">−</button><b>${p.qty}</b><button data-inc="${i}">+</button><button class="mm-cart-remove" data-del="${i}">Eliminar</button></div></div></div>`).join('')}function openCart(){drawer.classList.add('open');document.body.classList.add('mm-cart-lock')}function closeCart(){drawer.classList.remove('open');document.body.classList.remove('mm-cart-lock')}document.getElementById('cartAction').onclick=openCart;cartRoot.addEventListener('click',e=>{if(e.target.matches('[data-close],.mm-cart-close'))closeCart();const i=e.target.dataset.inc;if(i!==undefined){cart[i].qty++;saveCart();renderCart()}const d=e.target.dataset.dec;if(d!==undefined){cart[d].qty--;if(cart[d].qty<=0)cart.splice(d,1);saveCart();renderCart()}const x=e.target.dataset.del;if(x!==undefined){cart.splice(x,1);saveCart();renderCart()}});renderCart();render();
</script><script src="site-content.js"></script></body></html>
